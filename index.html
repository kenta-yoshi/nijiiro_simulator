<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <title>ご利用料金 概算シミュレーター｜デイサービス にじいろ</title>
  <meta name="description" content="かんたんな質問に答えるだけで、ご利用料金の目安がわかります。所要時間は約1分です。">

  <!-- OGP（LINEなどでURLを共有したときの表示） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="デイサービス にじいろ">
  <meta property="og:title" content="ご利用料金 概算シミュレーター｜デイサービス にじいろ">
  <meta property="og:description" content="かんたんな質問に答えるだけで、ご利用料金の目安がわかります。所要時間は約1分です。">
  <meta property="og:url" content="https://simulator.nijiiro-ds.com/">
  <meta property="og:image" content="https://simulator.nijiiro-ds.com/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- アイコン -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261120">
</head>
<body>

  <!-- ===== 画面0: パスワードロック（テスト環境 github.io でのみ表示） ===== -->
  <section id="screen-lock" class="screen">
    <div class="wrapper lock-wrapper">
      <div class="top-logo">
        <img src="nijiiro-logo.png" alt="デイサービス にじいろ" class="logo-img">
      </div>
      <h1 class="lock-title">パスワードを入力してください</h1>
      <div class="lock-form">
        <input type="password" id="lock-password" class="text-field lock-input" placeholder="パスワード" autocomplete="off">
        <p id="lock-error" class="lock-error" style="display:none;">パスワードが正しくありません</p>
        <button id="btn-unlock" class="btn btn-primary btn-lg lock-btn">ログイン</button>
      </div>
    </div>
  </section>

  <!-- ===== 画面1: トップ ===== -->
  <section id="screen-top" class="screen">
    <div class="wrapper top-wrapper">
      <div class="top-logo">
        <img src="nijiiro-logo.png" alt="デイサービス にじいろ" class="logo-img">
      </div>
      <h1 class="top-title">ご利用料金<br>概算シミュレーター</h1>
      <p class="top-lead">かんたんな質問に答えるだけで、<br>ご利用料金の目安がわかります。</p>
      <div class="top-info-box">
        <p>所要時間：約 <strong>1分</strong></p>
        <p class="note">こちらは概算の目安です。詳しくはお気軽にご相談ください。</p>
      </div>
      <button id="btn-start" class="btn btn-primary btn-lg">はじめる</button>
      <p class="top-facility" id="facility-name-top"></p>
    </div>
  </section>

  <!-- ===== 画面2: ステップフォーム ===== -->
  <section id="screen-form" class="screen">
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="wrapper">
      <p class="step-counter" id="step-indicator"></p>

      <!-- Step 1 -->
      <div class="step" data-step="1">
        <h2 class="step-heading"><span class="step-num">1</span>エリア</h2>
        <div class="question">
          <label class="q-label">Q1. ご検討中のエリアを教えてください</label>
          <div class="choice-list" id="q-area"></div>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step" data-step="2">
        <h2 class="step-heading"><span class="step-num">2</span>ご利用方法</h2>
        <div class="question">
          <label class="q-label">Q2. どのようなご利用を検討していますか？</label>
          <div class="choice-list" id="q-usage"></div>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="step" data-step="3">
        <h2 class="step-heading"><span class="step-num">3</span>介護保険</h2>
        <div class="question">
          <label class="q-label">Q3. 現在の要介護度を教えてください <button class="help-btn" data-term="要介護度" type="button">要介護度とは？ イラストで解説</button></label>
          <div class="choice-list" id="q-careLevel"></div>
        </div>
        <div class="question">
          <label class="q-label">Q4. 介護保険の自己負担割合は？ <button class="help-btn" data-term="自己負担割合" type="button">自己負担割合とは？ イラストで解説</button></label>
          <div class="choice-list" id="q-burdenRate"></div>
        </div>
      </div>

      <div class="form-nav">
        <button id="btn-prev" class="btn btn-secondary" style="visibility:hidden;">戻る</button>
        <button id="btn-next" class="btn btn-primary">次へ</button>
      </div>
    </div>
  </section>

  <!-- ===== 画面3: 結果 ===== -->
  <section id="screen-result" class="screen">
    <div class="wrapper result-wrapper">
      <h2 class="result-title">シミュレーション結果</h2>
      <p class="result-note">こちらは概算の目安です。詳細はご相談時にご確認ください。</p>

      <div class="card">
        <h3 class="card-heading" id="result-heading"></h3>
        <p class="result-conditions" id="result-conditions"></p>
        <div id="total-amount"></div>
        <p class="total-sub">（概算・目安）</p>

        <div class="accordion">
          <h4 class="accordion-toggle">費用の内訳</h4>
          <div class="accordion-body" id="breakdown">
            <div class="breakdown-group">
              <h4 class="breakdown-label">介護保険サービス費</h4>
              <table class="breakdown-tbl" id="breakdown-insurance"></table>
            </div>
            <div class="breakdown-group">
              <h4 class="breakdown-label">介護保険外（実費）</h4>
              <table class="breakdown-tbl" id="breakdown-non-insurance"></table>
            </div>
          </div>
        </div>

        <div id="result-notes"></div>
      </div>

      <p class="comfort-text">ご不安な点はお気軽にご相談ください。</p>

      <div class="card">
        <h3 class="card-heading">ご相談時にお持ちいただく書類</h3>
        <ul class="doc-list" id="doc-checklist"></ul>
      </div>

      <div class="caution-block">
        <h3 class="caution-heading">注意事項</h3>
        <ul class="caution-list" id="result-disclaimers"></ul>
      </div>

      <p class="result-foot" id="result-foot"></p>

      <div class="action-group action-group--result">
        <button id="btn-back-to-form" class="btn btn-secondary">戻る</button>
        <button id="btn-download" class="btn btn-primary">結果を画像でダウンロードする</button>
        <button id="btn-restart" class="btn btn-secondary">最初からやり直す</button>
      </div>

      <div class="contact-cta" id="contact-cta" style="display:none;">
        <a id="btn-contact" class="btn btn-contact" href="#"></a>
        <p class="contact-note" id="contact-note"></p>
      </div>
    </div>
  </section>

  <!-- ===== 用語モーダル ===== -->
  <div id="glossary-modal" class="modal-bg" style="display:none;">
    <div class="modal-box" id="modal-box">
      <div class="modal-top">
        <h3 id="glossary-term"></h3>
        <button id="modal-close" class="modal-x" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <p id="glossary-desc"></p>
        <div id="glossary-img-wrap" class="glossary-img-wrap" style="display:none;">
          <img id="glossary-img" class="glossary-img" src="" alt="">
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=20261120"></script>
</body>
</html>
